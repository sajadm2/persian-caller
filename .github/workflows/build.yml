name: Build APK from ZIP
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open project ZIP
        run: unzip -o persian-caller-github.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3         with:           packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare Persian voice
        run: python3 persian-caller/scripts/prepare_voice.py
      - name: Build APK
        run: gradle -p persian-caller --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PersianCaller-APK
          path: persian-caller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
