name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q KARA-0.14.zip -d "$RUNNER_TEMP/kara"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle offline Persian voice and native engine
        run: python3 "$RUNNER_TEMP/kara"/persian-caller/scripts/prepare_voice.py
      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/kara/persian-caller" --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KARA-APK
          path: ${{ runner.temp }}/kara/persian-caller/app/build/outputs/apk/debug/app-debug.apk
